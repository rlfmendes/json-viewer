[package]
name = "json-viewer"
version = "0.1.0"
edition = "2021"
authors = ["Ricardo"]
description = "A terminal-based JSON viewer with file browser and query capabilities"
license = "MIT"
repository = "https://github.com/yourusername/json-viewer"

[[bin]]
name = "json-viewer"
path = "src/main.rs"

[dependencies]
ratatui = "0.28"
crossterm = "0.28"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
walkdir = "2.5"
# Note: For now, queries are implemented with a built-in simple dot/bracket parser

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
