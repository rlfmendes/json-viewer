version: '3.8'

services:
  devcontainer:
    image: mcr.microsoft.com/devcontainers/rust:1-1-bookworm
    volumes:
      - ..:/workspace:cached
      - cargo-cache:/usr/local/cargo/registry
      - target-cache:/workspace/target
    
    command: sleep infinity
    
    working_dir: /workspace
    
    environment:
      - RUST_BACKTRACE=1
      - CARGO_HOME=/usr/local/cargo
    
    cap_add:
      - SYS_PTRACE
    
    security_opt:
      - seccomp:unconfined
    
    stdin_open: true
    tty: true

volumes:
  cargo-cache:
  target-cache:
